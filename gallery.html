<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | Maawande Msomi</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body data-theme="regular">
    <div class="bg-animation">
        <div class="gradient-bg"></div>
    </div>

    <nav class="glass-nav">
        <div class="nav-container">
            <div class="logo">
                <span class="logo-text">MM</span>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="projects.html">Projects</a></li>
                <li><a href="gallery.html" class="active">Gallery</a></li>
                <li><a href="cv.html">CV</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <span class="theme-icon">🌙</span>
                </button>
                <div class="mobile-menu">☰</div>
            </div>
        </div>
    </nav>

    <main class="container">
        <div class="glass-card page-header">
            <h1 class="page-title">Project Gallery</h1>
            <p class="page-subtitle">Visual showcase of apps I've built — click any image to view full size</p>
        </div>

        <div class="gallery-grid" id="galleryContainer">
            <!-- Gallery items loaded dynamically -->
        </div>
    </main>

    <!-- Lightbox for full-size preview -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <img src="" alt="" class="lightbox-img" id="lightboxImg">
        <div class="lightbox-caption" id="lightboxCaption"></div>
    </div>

    <script src="js/gallery.js"></script>
    <script src="js/main.js"></script>
